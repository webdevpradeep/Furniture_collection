<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dark background -->
  <rect width="100" height="100" rx="16" fill="#2d2d2d"/>
  
  <!-- Decorative swirl flourishes (top) -->
  <g fill="none" stroke="#e879b8" stroke-width="2.5" stroke-linecap="round">
    <!-- Left small swirl -->
    <path d="M38 28 C34 24, 30 26, 32 30 C34 34, 40 32, 38 28"/>
    <!-- Center swirl -->
    <path d="M50 22 C46 16, 40 18, 42 24 C44 30, 52 28, 50 22"/>
    <!-- Right long curl -->
    <path d="M55 18 C60 12, 68 14, 70 20 C72 26, 66 30, 62 26"/>
    <!-- Small right swirl -->
    <path d="M64 30 C62 26, 66 24, 68 28 C70 32, 66 34, 64 30"/>
  </g>
  
  <!-- "A" letter in pink elegant style -->
  <text 
    x="50" 
    y="78" 
    text-anchor="middle" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="52" 
    font-weight="bold"
    font-style="italic"
    fill="#e879b8"
    letter-spacing="-2"
  >a</text>
</svg>
